name: Archive Slack to Notion

on:
  schedule:
    # GitHub Actions cron is UTC only: 00:17 UTC on the 1st = 09:17 KST.
    - cron: "17 0 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Archive month in YYYY-MM format; leave blank for previous month"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: slack-notion-monthly-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCHIVE_MONTH: ${{ inputs.month || '' }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      AUTO_JOIN_PUBLIC_CHANNELS: ${{ vars.AUTO_JOIN_PUBLIC_CHANNELS }}
      SLACK_WORKSPACE_URL: ${{ vars.SLACK_WORKSPACE_URL }}
      MAX_IMAGE_MB: ${{ vars.MAX_IMAGE_MB || '200' }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Archive the target month
        run: python archive.py --publish
